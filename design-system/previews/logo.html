<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Last Bench — Logo</title>
<style>
  body { margin: 0; font-family: "Sora", system-ui, sans-serif; background: #FAFAF8; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
  .panel { border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 18px; }
  .light { background: #FAFAF8; border: 1px solid #E6F2E9; }
  .dark { background: #111111; }
  img { max-width: 100%; height: auto; }
  figcaption { grid-column: 1 / -1; color: #6B6F76; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="panel light"><img src="../logo.svg" alt="Last Bench logo on light" width="260"></div>
  <div class="panel dark"><img src="../logo.svg" alt="Last Bench logo on dark" width="260" style="filter: invert(1) hue-rotate(180deg);"></div>
  <figcaption>
    The bench is where every journey begins; the arrow is the future we build together.
    Digital SVG recreation — print-exact masters (primary, white, icon-only, badge) live in
    <code>assets/branding/logo-lockups.png</code>.
  </figcaption>
</body>
</html>
