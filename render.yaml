services:
  - type: web
    name: last-bench-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: FRONTEND_URL
        sync: false # e.g. https://www.lastbenchbd.com — required so OAuth login
                    # redirects real users to /app instead of localhost:8081
      - key: VITE_APP_ID
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
